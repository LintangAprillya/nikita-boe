{% extends "base.html" %}

{% block content %}
<body>

    <header class="hero">
        <h1>{{ wisata.nama }}</h1>
        <p>Beranda | Destinasi | {{ wisata.nama }}</p>
    </header>

    <div class="wisata-detail">
        <div class="wisata-item">
            <img src="{{ url_for('static', filename=wisata.gambar) }}" alt="{{ wisata.nama }}">
            <div class="layer"></div>
            <div class="info">
                <h3>{{ wisata.nama }}</h3>
                <p>{{ wisata.deskripsi_lengkap }}</p>
                <a href="{{ url_for('wisata') }}" class="btn">Kembali ke Wisata</a>
            </div>
        </div>
    </div>
</body>
{% endblock %}
