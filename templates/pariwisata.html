{% extends "base.html" %}

{% block content %}
<header class="page-header">
    <h1>Pariwisata di Maluku Tenggara</h1>
</header>

<section class="content-section">
    <h2>Destinasi Unggulan</h2>
    <div class="grid-container">
        {% for key, wisata in wisata_list.items() %}
        <div class="card">
            <img src="{{ url_for('static', filename=wisata.gambar) }}" alt="{{ wisata.nama }}">
            <div class="card-content">
                <h3>{{ wisata.nama }}</h3>
                <p>{{ wisata.deskripsi_singkat }}</p>
                <a href="/wisata/{{ key }}" class="btn">Lihat Detail</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

<style>
    /* HEADER */
    .page-header {
        background: url("{{ url_for('static', filename='files/bg-pariwisata.jpg') }}") no-repeat center center/cover;
        text-align: center;
        padding: 100px 20px;
        color: white;
        font-size: 28px;
        font-weight: bold;
        position: relative;
    }

    /* OVERLAY TRANSPARAN */
    .page-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
    }

    .page-header h1 {
        position: relative;
        z-index: 2;
    }

    /* GRID LAYOUT */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1100px;
        margin: auto;
        padding: 40px 20px;
    }

    /* KARTU DESTINASI */
    .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .card-content {
        padding: 20px;
    }

    .card-content h3 {
        margin: 10px 0;
        color: #008080;
        font-size: 22px;
    }

    .card-content p {
        font-size: 16px;
        color: #555;
        margin-bottom: 15px;
    }

    /* TOMBOL */
    .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #008080;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
        background: #005f5f;
        transform: scale(1.05);
    }
</style>
{% endblock %}
